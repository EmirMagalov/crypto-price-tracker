version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    command: celery -A celery_tasks.app.celery_app worker -l info
    depends_on:
      - db
      - redis
    env_file:
      - .env
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_beat
    command: celery -A celery_tasks.app.celery_app beat -l info
    depends_on:
      - db
      - redis
    env_file:
      - .env
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile-vue
#    volumes:
#      - ./frontend/vue-harry:/app

    ports:
      - "8080:80"


volumes:
  redis_data:
  postgres_data: